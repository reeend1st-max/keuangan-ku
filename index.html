<!-- Immediate PWA & ServiceWorker Cache Cleaner -->
<script>
(function() {
  var vKey = "v20260803_FORCE_CDN_REBOOT_V99";
  if (localStorage.getItem("app_cache_key") !== vKey) {
    localStorage.setItem("app_cache_key", vKey);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) { caches.delete(names[i]); }
      });
    }
  }
})();

function forceResetApp() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
    });
  }
  if ('caches' in window) {
    caches.keys().then(function(names) {
      for (var i = 0; i < names.length; i++) { caches.delete(names[i]); }
    });
  }
  localStorage.clear();
  sessionStorage.clear();
  window.location.reload(true);
}
</script>

<!-- Mobile Polyfill: Protect React DOM from Safari/Chrome Mobile auto-translate DOM mutations -->
<script>
if (typeof Node === "function" && Node.prototype) {
  var origRemove = Node.prototype.removeChild;
  Node.prototype.removeChild = function (child) {
    if (child && child.parentNode !== this) {
      if (window.console) console.warn("Prevented removeChild DOM mismatch:", child);
      return child;
    }
    return origRemove.apply(this, arguments);
  };
  var origInsert = Node.prototype.insertBefore;
  Node.prototype.insertBefore = function (newNode, refNode) {
    if (refNode && refNode.parentNode !== this) {
      if (window.console) console.warn("Prevented insertBefore DOM mismatch:", refNode);
      return newNode;
    }
    return origInsert.apply(this, arguments);
  };
}
</script>

<script>
function bootApp(retries) {
  retries = retries || 0;
  if (window.React && window.ReactDOM && window.supabase && window.Api && window.App) {
    var b = document.getElementById("boot-error");
    if (b) b.classList.remove("show");
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  } else if (retries < 30) {
    setTimeout(function() { bootApp(retries + 1); }, 100);
  } else {
    var b = document.getElementById("boot-error"), d = document.getElementById("boot-error-detail");
    if (d) d.textContent = "React/App sedang dimuat ulang dari CDN. Mengatur ulang...";
    if (b) b.classList.add("show");
  }
}
bootApp(0);
</script>
