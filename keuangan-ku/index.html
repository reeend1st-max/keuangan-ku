<!-- Auto Cache-Buster: Wipe old PWA ServiceWorker caches when theme changes -->
<script>
(function() {
  var vKey = "v20260803_ULTRA_WHITE_FIX";
  if (localStorage.getItem("app_cache_key") !== vKey) {
    localStorage.setItem("app_cache_key", vKey);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) { caches.delete(names[i]); }
      });
    }
  }
})();
</script>

<!-- Mobile Polyfill: Protect React DOM from Safari/Chrome Mobile auto-translate DOM mutations -->
<script>
if (typeof Node === "function" && Node.prototype) {
  var origRemove = Node.prototype.removeChild;
  Node.prototype.removeChild = function (child) {
    if (child && child.parentNode !== this) {
      if (window.console) console.warn("Prevented removeChild DOM mismatch:", child);
      return child;
    }
    return origRemove.apply(this, arguments);
  };
  var origInsert = Node.prototype.insertBefore;
  Node.prototype.insertBefore = function (newNode, refNode) {
    if (refNode && refNode.parentNode !== this) {
      if (window.console) console.warn("Prevented insertBefore DOM mismatch:", refNode);
      return newNode;
    }
    return origInsert.apply(this, arguments);
  };
}
</script>

<body style="background:#F8FAFC;margin:0;color:#0F172A;">
<div id="root"></div>
<div id="boot-error">
  <h2>⚠️ Memperbarui Aplikasi...</h2>
  <p style="color:#9CA3AF;font-size:14px;margin-bottom:16px;line-height:1.5;">Browser HP Anda menyimpan versi cache lama. Silakan tekan tombol hijau di bawah ini untuk memuat versi terbaru yang sudah diperbaiki.</p>
  <button onclick="clearMobileCache()" style="background:#00E5A3;color:#0A0E17;border:none;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,229,163,0.3);">🔄 Refresh Versi Terbaru</button>
  <pre id="boot-error-detail" style="margin-top:16px;font-size:11px;color:#6B7280;text-align:left;white-space:pre-wrap;word-break:break-all;"></pre>
</div>

<script>
function clearMobileCache() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
    });
  }
  if ('caches' in window) {
    caches.keys().then(function(names) {
      for (var i = 0; i < names.length; i++) { caches.delete(names[i]); }
    });
  }
  setTimeout(function() {
    window.location.reload(true);
  }, 400);
}

window.addEventListener("error", function(e) {
  var b = document.getElementById("boot-error"), d = document.getElementById("boot-error-detail");
  if (b && !b.classList.contains("show")) {
    if (d) d.textContent = (e.error && e.error.stack) ? e.error.stack : (e.message || "");
    b.classList.add("show");
  }
});
</script>

}

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js?v=20260803_ULTRA_WHITE_FIX_V100').then(function(reg) {
      reg.onupdatefound = function() {
        var installingWorker = reg.installing;
        if (installingWorker) {
          installingWorker.onstatechange = function() {
            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
              window.location.reload(true);
            }
          };
        }
      };
    }).catch(function() {});
  });
}
